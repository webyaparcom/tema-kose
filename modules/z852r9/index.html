  .modulex-zaman-sekme-yil :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-zaman-sekme-yil :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }

  .modulex-zaman-sekme-yil-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-zaman-sekme-yil-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-zaman-sekme-yil-bas { max-width: 780px; margin-inline: auto; text-align: center; justify-items: center; }
  .modulex-zaman-sekme-yil-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-zaman-sekme-yil-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-zaman-sekme-yil-dugme:hover { transform: translateY(-2px); }
  .modulex-zaman-sekme-yil-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }

  .modulex-zaman-sekme-yil-yillar { position: relative; display: flex; justify-content: space-between; gap: 8px; margin-block-end: 28px; overflow-x: auto; scrollbar-width: none; }
  .modulex-zaman-sekme-yil-yillar::before { content: ""; position: absolute; inset-inline: 0; inset-block-start: 9px; height: 2px; background: --cizgi--; }
  .modulex-zaman-sekme-yil:not(.modulex-zaman-sekme-yil--js) .modulex-zaman-sekme-yil-yillar { display: none; }
  .modulex-zaman-sekme-yil-sekme { position: relative; display: grid; justify-items: center; gap: 10px; flex: 1 0 auto; min-width: 72px; padding: 0 6px 6px; border: 0; background: transparent; color: --muted--; font: inherit; font-weight: 700; font-variant-numeric: tabular-nums; transition: color 0.25s ease; }
  .modulex-zaman-sekme-yil-nokta { width: 20px; height: 20px; border: 3px solid --cizgi--; border-radius: 50%; background: --bg--; transition: border-color 0.25s ease, background 0.25s ease, transform 0.25s ease; }
  .modulex-zaman-sekme-yil-sekme:hover { color: --text--; }
  .modulex-zaman-sekme-yil-sekme[aria-selected="true"] { color: --text--; }
  .modulex-zaman-sekme-yil-sekme[aria-selected="true"] .modulex-zaman-sekme-yil-nokta { border-color: --accent--; background: --accent--; transform: scale(1.25); }
  .modulex-zaman-sekme-yil-paneller { display: grid; gap: 16px; }
  .modulex-zaman-sekme-yil-panel { position: relative; display: grid; gap: 28px; align-items: center; padding: clamp(24px, 4vw, 48px); border-radius: --yuvarlak--; background: --bg--; animation: modulex-zaman-sekme-yil-gel 0.4s ease both; }
  .modulex-zaman-sekme-yil-panel--gorsel { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .modulex-zaman-sekme-yil-yazi { display: grid; gap: 10px; }
  .modulex-zaman-sekme-yil-yil { color: --accentInk--; font-size: clamp(2.4rem, 5vw, 3.6rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
  .modulex-zaman-sekme-yil-kbaslik { font-size: 1.5rem; font-weight: 750; }

  .modulex-zaman-sekme-yil-gorsel { width: 100%; height: 100%; max-height: 340px; object-fit: cover; border-radius: calc(--yuvarlak-- * 0.7); }
  @keyframes modulex-zaman-sekme-yil-gel { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (max-width: 768px) {
    .modulex-zaman-sekme-yil-yillar { justify-content: flex-start; }
    .modulex-zaman-sekme-yil-panel--gorsel { grid-template-columns: minmax(0, 1fr); }

  .modulex-zaman-sekme-yil-bag { color: inherit; text-decoration: none; }
  .modulex-zaman-sekme-yil-bag::after { content: ""; position: absolute; inset: 0; z-index: 3; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-zaman-sekme-yil :is(.modulex-zaman-sekme-yil-baslik, .modulex-zaman-sekme-yil-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-zaman-sekme-yil-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-zaman-sekme-yil { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-zaman-sekme-yil *, .modulex-zaman-sekme-yil *::before, .modulex-zaman-sekme-yil *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-zaman-sekme-yil";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const sekme = (s, P) => {
        const t = [...s.querySelectorAll("[role=tab]")];
        const p = [...s.querySelectorAll("[role=tabpanel]")];
        if (!t.length) return;
        s.classList.add(P + "--js");
        const sec = (i, odak) => {
          t.forEach((x, j) => { x.setAttribute("aria-selected", String(i === j)); x.tabIndex = i === j ? 0 : -1; });
          p.forEach((x, j) => { x.hidden = i !== j; });
          if (odak) t[i].focus();
        };
        sec(0);
        t.forEach((x, i) => {
          x.addEventListener("click", () => sec(i));
          x.addEventListener("keydown", (e) => {
            const rtl = getComputedStyle(s).direction === "rtl";
            const ileri = rtl ? "ArrowLeft" : "ArrowRight";
            const geri = rtl ? "ArrowRight" : "ArrowLeft";
            let n = -1;
            if (e.key === ileri || e.key === "ArrowDown") n = (i + 1) % t.length;
            else if (e.key === geri || e.key === "ArrowUp") n = (i - 1 + t.length) % t.length;
            else if (e.key === "Home") n = 0;
            else if (e.key === "End") n = t.length - 1;
            if (n > -1) { e.preventDefault(); sec(n, true); }
          });
        });
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      sekme(s, P, az);
    });
  })();
</script>
