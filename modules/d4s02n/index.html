<section class="modulex-sayac-eksen{{fbsinif}}" {{fbetiket}}>
  <div class="modulex-sayac-eksen-ic">
    {{fbbas}}
    {{fbgovde}}
  </div>
</section>

<style>
  /* sayac-eksen — Rakamları kutu ya da kart yerine bir eksen üzerine yerleştirir; zaman çizelgesi değil, dengeli üst-alt ritimli gösterim. */
  .modulex-sayac-eksen { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-sayac-eksen *, .modulex-sayac-eksen *::before, .modulex-sayac-eksen *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-sayac-eksen :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-sayac-eksen :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-sayac-eksen :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-sayac-eksen :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-sayac-eksen img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-sayac-eksen) img { height: auto; }
  .modulex-sayac-eksen [hidden] { display: none !important; }
  .modulex-sayac-eksen :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-sayac-eksen :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-sayac-eksen-ic { max-width: --max--; margin-inline: auto; }
  .modulex-sayac-eksen-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-sayac-eksen--bassiz .modulex-sayac-eksen-bas { display: none; }
  .modulex-sayac-eksen-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-sayac-eksen-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-sayac-eksen-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-sayac-eksen-bas { max-width: 780px; margin-inline: auto; text-align: center; justify-items: center; }
  .modulex-sayac-eksen-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-sayac-eksen-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-sayac-eksen-dugme:hover { transform: translateY(-2px); }
  .modulex-sayac-eksen-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-sayac-eksen-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-sayac-eksen-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-sayac-eksen-eksen { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); grid-template-rows: 1fr auto 1fr; column-gap: 20px; }
  .modulex-sayac-eksen-eksen::before { content: ""; position: absolute; inset-inline: 0; inset-block-start: 50%; height: 2px; background: --cizgi--; transform-origin: center; transition: transform 1.2s ease; }
  .modulex-sayac-eksen--hazir:not(.modulex-sayac-eksen--gor) .modulex-sayac-eksen-eksen::before { transform: scaleX(0); }
  .modulex-sayac-eksen-oge { display: grid; grid-row: 1 / -1; grid-template-rows: subgrid; justify-items: center; text-align: center; }
  .modulex-sayac-eksen-dugum { grid-row: 2; position: relative; z-index: 1; display: inline-grid; place-items: center; width: 52px; height: 52px; margin-block: 18px; border-radius: 50%; background: --bg--; border: 2px solid --accent--; color: --accentInk--; transition: background 0.3s ease, color 0.3s ease; }
  .modulex-sayac-eksen-dugum .material-symbols-outlined { font-size: 24px; }
  .modulex-sayac-eksen-dugum:empty::after { content: ""; width: 12px; height: 12px; border-radius: 50%; background: --accent--; }
  .modulex-sayac-eksen-oge:hover .modulex-sayac-eksen-dugum { background: --accent--; color: --accentText--; }
  .modulex-sayac-eksen-yazi { display: grid; gap: 4px; align-content: end; }
  .modulex-sayac-eksen-oge:nth-child(even) .modulex-sayac-eksen-yazi { grid-row: 3; align-content: start; }
  .modulex-sayac-eksen-oge:nth-child(odd) .modulex-sayac-eksen-yazi { grid-row: 1; }
  .modulex-sayac-eksen-sayi { font-size: clamp(1.9rem, 3.4vw, 2.6rem); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .modulex-sayac-eksen-ek { color: --accentInk--; font-size: 0.6em; }
  .modulex-sayac-eksen-etiket { font-size: 1rem; font-weight: 700; }
  .modulex-sayac-eksen-not { color: --muted--; font-size: 0.88rem; }
  @media (max-width: 768px) {
    .modulex-sayac-eksen-eksen { grid-auto-flow: row; grid-template-rows: none; grid-template-columns: auto minmax(0, 1fr); row-gap: 8px; column-gap: 16px; }
    .modulex-sayac-eksen-eksen::before { inset-block: 0; inset-inline-start: 25px; inset-inline-end: auto; width: 2px; height: auto; }
    .modulex-sayac-eksen-oge { grid-column: 1 / -1; grid-row: auto; grid-template-rows: none; grid-template-columns: subgrid; justify-items: start; text-align: start; }
    .modulex-sayac-eksen-dugum { grid-row: 1; grid-column: 1; margin-block: 0; }
    .modulex-sayac-eksen-oge:nth-child(n) .modulex-sayac-eksen-yazi { grid-row: 1; grid-column: 2; align-content: center; }
  }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-eksen :is(.modulex-sayac-eksen-baslik, .modulex-sayac-eksen-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-eksen-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-sayac-eksen { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-sayac-eksen *, .modulex-sayac-eksen *::before, .modulex-sayac-eksen *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-sayac-eksen";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const gozlem = (s, P, az) => {
        const gor = () => s.classList.add(P + "--gor");
        s.classList.add(P + "--hazir");
        if (az || !("IntersectionObserver" in window)) { gor(); return; }
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { gor(); io.disconnect(); } });
        }, { threshold: 0.15 });
        io.observe(s);
      };
    const sayac = (s, P, az) => {
        const el = [...s.querySelectorAll("[data-hedef]")];
        if (!el.length || az || !("IntersectionObserver" in window)) return;
        const dl = document.documentElement.lang || undefined;
        const oynat = () => el.forEach((e) => {
          const h = Number(e.dataset.hedef);
          const od = Number(e.dataset.ondalik) || 0;
          const son = e.textContent;
          if (!Number.isFinite(h)) return;
          let f;
          try { f = new Intl.NumberFormat(dl, { minimumFractionDigits: od, maximumFractionDigits: od }); } catch (x) { return; }
          const t0 = performance.now();
          const adim = (t) => {
            const p = Math.min(1, (t - t0) / 1300);
            e.textContent = p < 1 ? f.format(h * (1 - Math.pow(1 - p, 3))) : son;
            if (p < 1) requestAnimationFrame(adim);
          };
          requestAnimationFrame(adim);
        });
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { oynat(); io.disconnect(); } });
        }, { threshold: 0.3 });
        io.observe(s);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      gozlem(s, P, az);
      sayac(s, P, az);
    });
  })();
</script>
